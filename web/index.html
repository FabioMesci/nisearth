<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>España desde el radar · NISAR</title>
    <meta name="description" content="Inundaciones e incendios de 2026 en España vistos por el radar NISAR (NASA-ISRO). NASA Space Apps 2026 · Dancing with the SARs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="globe" class="view"></div>
    <div id="map" class="view hidden"></div>

    <header id="brand">
      <div class="kicker" data-i18n="kicker"></div>
      <h1><span data-i18n="title1"></span> <span class="accent" data-i18n="title2"></span></h1>
      <p data-i18n="tagline"></p>
    </header>

    <div id="lang" class="seg small" role="group" aria-label="Idioma / Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>

    <aside id="cases" class="card">
      <div class="label" data-i18n="incidents"></div>
      <ul id="case-list"></ul>
      <button id="story-btn" class="btn ghost" data-i18n="story"></button>
      <button id="hazards-btn" class="btn ghost" data-i18n="hazardsBtn"></button>
    </aside>

    <div id="hazards" class="hidden" role="dialog" aria-modal="true"></div>

    <button id="back-btn" class="btn hidden" data-i18n="back"></button>

    <aside id="panel" class="hidden"></aside>

    <div id="story" class="hidden"></div>

    <div id="slider-handle" class="hidden" aria-label="Deslizador antes/después"><span>◀ ▶</span></div>
    <div id="slider-labels" class="hidden"><span id="lbl-before"></span><span id="lbl-after"></span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
