<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>España desde el radar · NISAR</title>
    <meta name="description" content="Inundaciones e incendios de 2026 en España vistos por el radar NISAR (NASA-ISRO). NASA Space Apps 2026 · Dancing with the SARs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="globe" class="view"></div>
    <div id="map" class="view hidden"></div>

    <header id="brand">
      <h1><span data-i18n="title1"></span> <span class="accent" data-i18n="title2"></span></h1>
      <p data-i18n="tagline"></p>
      <div class="credit" data-i18n="kicker"></div>
    </header>

    <div id="lang" class="seg small" role="group" aria-label="Idioma / Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>

    <aside id="cases" class="card">
      <div class="label" data-i18n="incidents"></div>
      <ul id="case-list"></ul>
      <section id="watch" class="hidden"></section>
      <button id="story-btn" class="btn primary"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10.5 9v6l4.5-3-4.5-3Z" fill="currentColor"/></svg><span data-i18n="story"></span></button>
      <button id="hazards-btn" class="btn ghost"><span data-i18n="hazardsBtn"></span></button>
    </aside>

    <div id="hazards" class="hidden" role="dialog" aria-modal="true"></div>

    <button id="back-btn" class="btn hidden"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span data-i18n="back"></span></button>

    <aside id="panel" class="hidden"></aside>

    <div id="story" class="hidden"></div>

    <div id="slider-handle" class="hidden" aria-label="Deslizador antes/después"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span></div>
    <div id="slider-labels" class="hidden"><span id="lbl-before"></span><span id="lbl-after"></span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
